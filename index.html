<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi comunidad</title>

  <!-- SDK oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #0866ff;
      --blue-dark: #075ce5;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #050505;
      --muted: #65676b;
      --border: #dddfe2;
      --hover: #f2f2f2;
      --danger: #e41e3f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(16px, calc((100vw - 1120px) / 2));
      background: #fff;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--blue);
      font-size: 23px;
      font-weight: 800;
    }

    .brand-mark {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      color: #fff;
      background: var(--blue);
      border-radius: 50%;
      font-size: 20px;
    }

    .author-access {
      padding: 9px 14px;
      color: #fff;
      background: var(--blue);
      border-radius: 8px;
      font-weight: 700;
    }

    .author-access:hover { background: var(--blue-dark); }

    .layout {
      width: min(680px, 100%);
      margin: 24px auto 50px;
      padding: 0 12px;
    }

    .composer-card,
    .post-card {
      overflow: hidden;
      margin-bottom: 16px;
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .composer-card {
      padding: 12px 16px;
    }

    .composer-top {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #4b6cb7, #182848);
      border-radius: 50%;
      font-weight: bold;
      user-select: none;
    }

    .composer-open {
      width: 100%;
      padding: 10px 14px;
      color: var(--muted);
      text-align: left;
      background: var(--bg);
      border-radius: 22px;
    }

    .composer-open:hover { background: #e4e6e9; }

    .composer-options {
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }

    .media-open {
      padding: 8px 16px;
      color: var(--muted);
      background: transparent;
      border-radius: 7px;
      font-weight: 700;
    }

    .media-open:hover { background: var(--hover); }

    .post-header {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 16px 8px;
    }

    .post-author {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .post-author strong { font-size: 15px; }

    .post-date {
      color: var(--muted);
      font-size: 13px;
    }

    .post-content {
      padding: 4px 16px 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.35;
    }

    .post-media {
      width: 100%;
      max-height: 650px;
      object-fit: contain;
      vertical-align: middle;
      background: #111;
    }

    img.post-media {
      cursor: zoom-in;
    }

    .post-stats {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .reaction-badge {
      display: inline-grid;
      width: 20px;
      height: 20px;
      margin-right: 4px;
      place-items: center;
      color: #fff;
      background: var(--blue);
      border-radius: 50%;
      font-size: 12px;
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin: 0 16px;
      padding: 4px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .action-btn {
      padding: 9px 6px;
      color: var(--muted);
      background: transparent;
      border-radius: 6px;
      font-weight: 700;
    }

    .action-btn:hover { background: var(--hover); }

    .action-btn.active {
      color: var(--blue);
    }

    .comments {
      padding: 10px 16px 14px;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 10px;
    }

    .comment {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .comment .avatar {
      width: 32px;
      height: 32px;
      flex-basis: 32px;
      font-size: 12px;
    }

    .comment-bubble {
      max-width: calc(100% - 40px);
      padding: 8px 11px;
      background: var(--bg);
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .comment-bubble strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .comment-input {
      width: 100%;
      padding: 9px 12px;
      outline: none;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 18px;
    }

    .comment-input:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .send-comment {
      padding: 8px 10px;
      color: var(--blue);
      background: transparent;
      font-weight: 700;
    }

    .empty-state {
      padding: 36px 18px;
      color: var(--muted);
      text-align: center;
      background: #fff;
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    /* Modales */
    .modal-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .55);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    }

    .modal-header {
      position: relative;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-modal {
      position: absolute;
      top: 9px;
      right: 10px;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: #333;
      background: #e4e6eb;
      border-radius: 50%;
      font-size: 25px;
      line-height: 1;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-author {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-author div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .modal-author small { color: var(--muted); }

    .post-textarea {
      width: 100%;
      min-height: 125px;
      padding: 8px 0;
      resize: vertical;
      outline: none;
      border: none;
      font-size: 18px;
      line-height: 1.4;
    }

    .file-zone {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 95px;
      margin: 10px 0;
      overflow: hidden;
      color: var(--muted);
      text-align: center;
      background: #f7f8fa;
      border: 1px dashed #b0b3b8;
      border-radius: 8px;
    }

    .file-zone label {
      width: 100%;
      padding: 25px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    #mediaPreview {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #111;
    }

    .remove-media {
      display: none;
      position: absolute;
      z-index: 2;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      color: #fff;
      background: rgba(0, 0, 0, .7);
      border-radius: 50%;
      font-size: 18px;
    }

    .publish-btn {
      width: 100%;
      padding: 11px;
      color: #fff;
      background: var(--blue);
      border-radius: 7px;
      font-weight: 800;
    }

    .publish-btn:hover { background: var(--blue-dark); }

    .publish-btn:disabled {
      cursor: not-allowed;
      background: #bcc0c4;
    }

    .image-modal {
      width: auto;
      max-width: 96vw;
      background: transparent;
      box-shadow: none;
    }

    .image-modal img,
    .image-modal video {
      display: block;
      max-width: 96vw;
      max-height: 90vh;
      margin: auto;
      object-fit: contain;
    }

    .image-modal .close-modal {
      position: fixed;
      top: 14px;
      right: 16px;
      color: #fff;
      background: rgba(0, 0, 0, .65);
    }

    .notice {
      position: fixed;
      z-index: 300;
      bottom: 20px;
      left: 50%;
      max-width: min(90vw, 480px);
      padding: 12px 16px;
      color: #fff;
      text-align: center;
      background: #242526;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      transform: translateX(-50%);
      animation: appear .2s ease-out;
    }

    @keyframes appear {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 540px) {
      .topbar { padding: 0 12px; }
      .brand { font-size: 18px; }
      .layout { margin-top: 12px; padding: 0; }
      .composer-card, .post-card { border-radius: 0; }
      .modal-backdrop { padding: 0; }
      .modal { max-height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">M</span>
      <span>Mi comunidad</span>
    </div>

    <button id="authorLoginBtn" class="author-access" type="button">
      Acceso de autor
    </button>
  </header>

  <main class="layout">
    <section class="composer-card" aria-label="Crear publicación">
      <div class="composer-top">
        <div class="avatar">TÚ</div>
        <button id="openPostModal" class="composer-open" type="button">
          ¿Qué estás pensando?
        </button>
      </div>

      <div class="composer-options">
        <button id="openMediaModal" class="media-open" type="button">
          🖼️ Foto o vídeo
        </button>
      </div>
    </section>

    <section id="feed" aria-live="polite">
      <div class="empty-state">Cargando publicaciones...</div>
    </section>
  </main>

  <!-- Modal para crear publicaciones -->
  <div id="postModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="postModalTitle">
    <div class="modal">
      <header class="modal-header">
        <h2 id="postModalTitle">Crear publicación</h2>
        <button class="close-modal" data-close="postModalBackdrop" aria-label="Cerrar">&times;</button>
      </header>

      <div class="modal-body">
        <div class="modal-author">
          <div class="avatar">TÚ</div>
          <div>
            <strong id="modalAuthorName">Tu página</strong>
            <small>🌐 Público</small>
          </div>
        </div>

        <textarea
          id="postContent"
          class="post-textarea"
          maxlength="5000"
          placeholder="¿Qué quieres compartir?"
        ></textarea>

        <div class="file-zone">
          <label id="fileLabel" for="mediaFile">
            📷 Agregar foto o vídeo
          </label>

          <input id="mediaFile" type="file" accept="image/*,video/*" hidden />
          <img id="mediaPreview" alt="Vista previa del archivo seleccionado" />
          <button id="removeMediaBtn" class="remove-media" type="button" aria-label="Quitar archivo">&times;</button>
        </div>

        <button id="publishBtn" class="publish-btn" type="button">
          Publicar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal para ampliar foto o vídeo -->
  <div id="viewerBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Vista ampliada">
    <div class="image-modal">
      <button class="close-modal" data-close="viewerBackdrop" aria-label="Cerrar">&times;</button>
      <div id="viewerContent"></div>
    </div>
  </div>

  <script>
    /**************************************************************************
     * CONFIGURACIÓN DEL PROYECTO
     **************************************************************************/
    const SUPABASE_URL = "https://sgcptxtfrnunedwuodbw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnY3B0eHRmcm51bmVkd3VvZGJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDg4NDIsImV4cCI6MjEwMjQyNDg0Mn0.X9s8owZcB3aZwHMeZzt88t0a-Tkx3_qMaMa1C4SENQk";
    const ADMIN_EMAIL = "entrerimasybotellas+pelitos@gmail.com".toLowerCase();

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const feed = document.getElementById("feed");
    const postModalBackdrop = document.getElementById("postModalBackdrop");
    const viewerBackdrop = document.getElementById("viewerBackdrop");
    const postContent = document.getElementById("postContent");
    const mediaFile = document.getElementById("mediaFile");
    const mediaPreview = document.getElementById("mediaPreview");
    const fileLabel = document.getElementById("fileLabel");
    const removeMediaBtn = document.getElementById("removeMediaBtn");
    const publishBtn = document.getElementById("publishBtn");
    const authorLoginBtn = document.getElementById("authorLoginBtn");

    let selectedFile = null;
    let previewUrl = null;
    let currentUser = null;

    function showNotice(message) {
      const old = document.querySelector(".notice");
      if (old) old.remove();

      const notice = document.createElement("div");
      notice.className = "notice";
      notice.textContent = message;
      document.body.appendChild(notice);

      setTimeout(() => notice.remove(), 3500);
    }

    function escapeInitials(text) {
      return (text || "U")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

      if (seconds < 60) return "Ahora mismo";
      if (seconds < 3600) return `Hace ${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `Hace ${Math.floor(seconds / 3600)} h`;
      if (seconds < 604800) return `Hace ${Math.floor(seconds / 86400)} d`;

      return new Intl.DateTimeFormat("es", {
        day: "numeric",
        month: "short",
        year: "numeric"
      }).format(date);
    }

    function isAdmin() {
      return currentUser?.email?.toLowerCase() === ADMIN_EMAIL;
    }

    async function ensureAnonymousSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (session) {
        currentUser = session.user;
        return session.user;
      }

      const { data, error } = await supabaseClient.auth.signInAnonymously();

      if (error) {
        console.warn("No se pudo iniciar sesión anónima:", error.message);
        return null;
      }

      currentUser = data.user;
      return currentUser;
    }

    function updateAuthorUI() {
      const admin = isAdmin();

      authorLoginBtn.textContent = admin ? "Autor conectado" : "Acceso de autor";
      authorLoginBtn.style.background = admin ? "#42b72a" : "";

      document.getElementById("modalAuthorName").textContent =
        admin ? currentUser.email : "Tu página";

      document.getElementById("openPostModal").disabled = !admin;
      document.getElementById("openMediaModal").disabled = !admin;

      if (!admin) {
        document.getElementById("openPostModal").textContent =
          "Solo el autor puede crear publicaciones";
      } else {
        document.getElementById("openPostModal").textContent =
          "¿Qué estás pensando?";
      }
    }

    function openPostModal() {
      if (!isAdmin()) {
        showNotice("Debes acceder con el correo autorizado para publicar.");
        return;
      }

      postModalBackdrop.classList.add("show");
      setTimeout(() => postContent.focus(), 100);
    }

    function closePostModal() {
      postModalBackdrop.classList.remove("show");
    }

    function clearSelectedMedia() {
      selectedFile = null;
      mediaFile.value = "";

      if (previewUrl) URL.revokeObjectURL(previewUrl);

      previewUrl = null;
      mediaPreview.removeAttribute("src");
      mediaPreview.style.display = "none";
      removeMediaBtn.style.display = "none";
      fileLabel.style.display = "block";
      fileLabel.textContent = "📷 Agregar foto o vídeo";
    }

    function resetPostForm() {
      postContent.value = "";
      clearSelectedMedia();
      publishBtn.disabled = false;
      publishBtn.textContent = "Publicar";
    }

    function openViewer(url, mediaType) {
      const viewerContent = document.getElementById("viewerContent");
      viewerContent.innerHTML = "";

      if (mediaType === "video") {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.autoplay = true;
        viewerContent.appendChild(video);
      } else {
        const image = document.createElement("img");
        image.src = url;
        image.alt = "Imagen ampliada";
        viewerContent.appendChild(image);
      }

      viewerBackdrop.classList.add("show");
    }

    async function requestAuthorAccess() {
      if (isAdmin()) {
        showNotice("Ya has iniciado sesión como autor.");
        return;
      }

      const email = prompt("Escribe el correo autorizado para administrar la página:");

      if (!email) return;

      if (email.trim().toLowerCase() !== ADMIN_EMAIL) {
        showNotice("Ese correo no está autorizado para publicar.");
        return;
      }

      const redirectUrl = window.location.origin + window.location.pathname;

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email.trim(),
        options: {
          emailRedirectTo: redirectUrl
        }
      });

      if (error) {
        showNotice(`No se pudo enviar el enlace: ${error.message}`);
        return;
      }

      showNotice("Revisa tu correo y abre el enlace de acceso.");
    }

    async function uploadMedia(file) {
      const extension = file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : (file.type.startsWith("video/") ? "mp4" : "jpg");

      const safeName = `${Date.now()}-${crypto.randomUUID()}.${extension}`;
      const filePath = `${currentUser.id}/${safeName}`;

      const { error: uploadError } = await supabaseClient.storage
        .from("post-media")
        .upload(filePath, file, {
          contentType: file.type,
          upsert: false
        });

      if (uploadError) throw uploadError;

      const { data } = supabaseClient.storage
        .from("post-media")
        .getPublicUrl(filePath);

      return {
        path: filePath,
        url: data.publicUrl,
        type: file.type.startsWith("video/") ? "video" : "image"
      };
    }

    async function publishPost() {
      if (!isAdmin()) {
        showNotice("No tienes permiso para publicar.");
        return;
      }

      const content = postContent.value.trim();

      if (!content && !selectedFile) {
        showNotice("Escribe un mensaje o selecciona una foto o vídeo.");
        return;
      }

      if (selectedFile && selectedFile.size > 50 * 1024 * 1024) {
        showNotice("El archivo no puede superar 50 MB.");
        return;
      }

      publishBtn.disabled = true;
      publishBtn.textContent = "Publicando...";

      let uploadedFile = null;

      try {
        if (selectedFile) {
          uploadedFile = await uploadMedia(selectedFile);
        }

        const { error } = await supabaseClient
          .from("posts")
          .insert({
            content,
            media_url: uploadedFile?.url || null,
            media_type: uploadedFile?.type || null
          });

        if (error) throw error;

        resetPostForm();
        closePostModal();
        await loadFeed();
        showNotice("Publicación creada correctamente.");
      } catch (error) {
        console.error(error);

        // Si la subida funcionó, pero no se pudo insertar la publicación,
        // se borra el archivo para no dejar contenido huérfano.
        if (uploadedFile?.path) {
          await supabaseClient.storage
            .from("post-media")
            .remove([uploadedFile.path]);
        }

        showNotice(`Error al publicar: ${error.message}`);
        publishBtn.disabled = false;
        publishBtn.textContent = "Publicar";
      }
    }

    async function toggleReaction(postId) {
      const user = await ensureAnonymousSession();

      if (!user) {
        showNotice("No se pudo iniciar tu sesión de visitante.");
        return;
      }

      const { data: existing, error: checkError } = await supabaseClient
        .from("reactions")
        .select("post_id")
        .eq("post_id", postId)
        .eq("user_id", user.id)
        .maybeSingle();

      if (checkError) {
        showNotice("No se pudo procesar la reacción.");
        return;
      }

      let error;

      if (existing) {
        ({ error } = await supabaseClient
          .from("reactions")
          .delete()
          .eq("post_id", postId)
          .eq("user_id", user.id));
      } else {
        ({ error } = await supabaseClient
          .from("reactions")
          .insert({
            post_id: postId,
            user_id: user.id,
            reaction_type: "like"
          }));
      }

      if (error) {
        showNotice(`No se pudo actualizar la reacción: ${error.message}`);
        return;
      }

      await loadFeed();
    }

    async function submitComment(postId, input) {
      const content = input.value.trim();

      if (!content) return;

      const user = await ensureAnonymousSession();

      if (!user) {
        showNotice("No se pudo iniciar tu sesión de visitante.");
        return;
      }

      input.disabled = true;

      const { error } = await supabaseClient
        .from("comments")
        .insert({
          post_id: postId,
          author_id: user.id,
          author_name: isAdmin() ? "Autor de la página" : "Invitado",
          content
        });

      input.disabled = false;

      if (error) {
        showNotice(`No se pudo publicar el comentario: ${error.message}`);
        return;
      }

      input.value = "";
      await loadFeed();
    }

    async function sharePost(post) {
      const url = `${window.location.href.split("#")[0]}#post-${post.id}`;
      const shareData = {
        title: "Publicación de Mi comunidad",
        text: post.content || "Mira esta publicación",
        url
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(url);
          showNotice("Enlace copiado. Ya puedes pegarlo en otra aplicación.");
        }
      } catch (error) {
        // Cancelar la ventana de compartir no se considera un error importante.
        if (error.name !== "AbortError") {
          showNotice("No se pudo compartir la publicación.");
        }
      }
    }

    function createAvatar(initials) {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = initials;
      return avatar;
    }

    function createPostElement(post, comments, reactions) {
      const card = document.createElement("article");
      card.className = "post-card";
      card.id = `post-${post.id}`;

      const postReactions = reactions.filter(r => r.post_id === post.id);
      const postComments = comments.filter(c => c.post_id === post.id);
      const likedByCurrentUser = currentUser &&
        postReactions.some(r => r.user_id === currentUser.id);

      const header = document.createElement("div");
      header.className = "post-header";
      header.appendChild(createAvatar("MC"));

      const authorData = document.createElement("div");
      authorData.className = "post-author";

      const author = document.createElement("strong");
      author.textContent = "Mi comunidad";

      const date = document.createElement("span");
      date.className = "post-date";
      date.textContent = `${formatDate(post.created_at)} · 🌐`;

      authorData.append(author, date);
      header.appendChild(authorData);
      card.appendChild(header);

      if (post.content) {
        const content = document.createElement("div");
        content.className = "post-content";
        content.textContent = post.content;
        card.appendChild(content);
      }

      if (post.media_url) {
        if (post.media_type === "video") {
          const video = document.createElement("video");
          video.className = "post-media";
          video.src = post.media_url;
          video.controls = true;
          video.preload = "metadata";
          card.appendChild(video);
        } else {
          const image = document.createElement("img");
          image.className = "post-media";
          image.src = post.media_url;
          image.alt = "Imagen de la publicación";
          image.loading = "lazy";
          image.addEventListener("click", () => openViewer(post.media_url, "image"));
          card.appendChild(image);
        }
      }

      const stats = document.createElement("div");
      stats.className = "post-stats";

      const likes = document.createElement("span");
      likes.innerHTML = postReactions.length
        ? `<span class="reaction-badge">♥</span>${postReactions.length}`
        : "";

      const commentsCount = document.createElement("span");
      commentsCount.textContent = postComments.length
        ? `${postComments.length} comentario${postComments.length !== 1 ? "s" : ""}`
        : "";

      stats.append(likes, commentsCount);
      card.appendChild(stats);

      const actions = document.createElement("div");
      actions.className = "post-actions";

      const reactButton = document.createElement("button");
      reactButton.className = `action-btn ${likedByCurrentUser ? "active" : ""}`;
      reactButton.textContent = likedByCurrentUser ? "♥ Me gusta" : "♡ Reaccionar";
      reactButton.addEventListener("click", () => toggleReaction(post.id));

      const commentButton = document.createElement("button");
      commentButton.className = "action-btn";
      commentButton.textContent = "💬 Comentar";

      const shareButton = document.createElement("button");
      shareButton.className = "action-btn";
      shareButton.textContent = "↗ Compartir";
      shareButton.addEventListener("click", () => sharePost(post));

      actions.append(reactButton, commentButton, shareButton);
      card.appendChild(actions);

      const commentsArea = document.createElement("div");
      commentsArea.className = "comments";

      const commentsList = document.createElement("div");
      commentsList.className = "comment-list";

      postComments.slice(-5).forEach(comment => {
        const commentItem = document.createElement("div");
        commentItem.className = "comment";

        commentItem.appendChild(createAvatar(escapeInitials(comment.author_name)));

        const bubble = document.createElement("div");
        bubble.className = "comment-bubble";

        const name = document.createElement("strong");
        name.textContent = comment.author_name;

        const text = document.createElement("span");
        text.textContent = comment.content;

        bubble.append(name, text);
        commentItem.appendChild(bubble);
        commentsList.appendChild(commentItem);
      });

      const form = document.createElement("form");
      form.className = "comment-form";

      const input = document.createElement("input");
      input.className = "comment-input";
      input.maxLength = 1000;
      input.placeholder = "Escribe un comentario...";
      input.setAttribute("aria-label", "Escribe un comentario");

      const send = document.createElement("button");
      send.className = "send-comment";
      send.type = "submit";
      send.textContent = "Enviar";

      form.append(input, send);
      form.addEventListener("submit", event => {
        event.preventDefault();
        submitComment(post.id, input);
      });

      commentButton.addEventListener("click", () => input.focus());

      commentsArea.append(commentsList, form);
      card.appendChild(commentsArea);

      return card;
    }

    async function loadFeed() {
      feed.innerHTML = `<div class="empty-state">Cargando publicaciones...</div>`;

      const { data: posts, error: postsError } = await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", { ascending: false });

      if (postsError) {
        feed.innerHTML = `<div class="empty-state">No se pudieron cargar las publicaciones.</div>`;
        console.error(postsError);
        return;
      }

      if (!posts.length) {
        feed.innerHTML = `<div class="empty-state">Todavía no hay publicaciones. ¡La primera puede ser tuya!</div>`;
        return;
      }

      const postIds = posts.map(post => post.id);

      const [{ data: comments, error: commentsError }, { data: reactions, error: reactionsError }] =
        await Promise.all([
          supabaseClient
            .from("comments")
            .select("*")
            .in("post_id", postIds)
            .order("created_at", { ascending: true }),
          supabaseClient
            .from("reactions")
            .select("*")
            .in("post_id", postIds)
        ]);

      if (commentsError) console.warn(commentsError);
      if (reactionsError) console.warn(reactionsError);

      feed.innerHTML = "";

      posts.forEach(post => {
        feed.appendChild(
          createPostElement(post, comments || [], reactions || [])
        );
      });
    }

    mediaFile.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
        showNotice("Selecciona solamente una imagen o un vídeo.");
        clearSelectedMedia();
        return;
      }

      if (file.size > 50 * 1024 * 1024) {
        showNotice("El archivo no puede superar 50 MB.");
        clearSelectedMedia();
        return;
      }

      selectedFile = file;

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);

      mediaPreview.style.display = "block";
      mediaPreview.src = previewUrl;

      // Si es vídeo, se cambia el elemento img por un video temporal para previsualizar.
      if (file.type.startsWith("video/")) {
        const videoPreview = document.createElement("video");
        videoPreview.id = "mediaPreview";
        videoPreview.controls = true;
        videoPreview.src = previewUrl;
        videoPreview.style.cssText = "display:block;width:100%;max-height:260px;background:#111;";

        mediaPreview.replaceWith(videoPreview);

        // Actualizamos la referencia global para poder restaurarla al eliminar.
        window.currentPreviewElement = videoPreview;
      } else {
        const existingVideo = document.querySelector("video#mediaPreview");

        if (existingVideo) {
          const newImage = document.createElement("img");
          newImage.id = "mediaPreview";
          newImage.alt = "Vista previa del archivo seleccionado";
          newImage.style.cssText = "display:block;width:100%;max-height:260px;object-fit:contain;background:#111;";
          newImage.src = previewUrl;
          existingVideo.replaceWith(newImage);
        }
      }

      fileLabel.style.display = "none";
      removeMediaBtn.style.display = "block";
    });

    removeMediaBtn.addEventListener("click", () => {
      const videoPreview = document.querySelector("video#mediaPreview");

      if (videoPreview) {
        const newImage = document.createElement("img");
        newImage.id = "mediaPreview";
        newImage.alt = "Vista previa del archivo seleccionado";
        newImage.style.display = "none";
        videoPreview.replaceWith(newImage);
      }

      clearSelectedMedia();
    });

    document.getElementById("openPostModal").addEventListener("click", openPostModal);
    document.getElementById("openMediaModal").addEventListener("click", openPostModal);
    publishBtn.addEventListener("click", publishPost);
    authorLoginBtn.addEventListener("click", requestAuthorAccess);

    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById(button.dataset.close).classList.remove("show");
      });
    });

    [postModalBackdrop, viewerBackdrop].forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) backdrop.classList.remove("show");
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        postModalBackdrop.classList.remove("show");
        viewerBackdrop.classList.remove("show");
      }
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
      updateAuthorUI();
      loadFeed();
    });

    async function init() {
      if (
        SUPABASE_URL.includes("PEGA_AQUI") ||
        SUPABASE_ANON_KEY.includes("PEGA_AQUI") ||
        ADMIN_EMAIL.includes("TU_CORREO")
      ) {
        feed.innerHTML = `
          <div class="empty-state">
            Configura <strong>SUPABASE_URL</strong>, <strong>SUPABASE_ANON_KEY</strong>
            y <strong>ADMIN_EMAIL</strong> en el código antes de usar la página.
          </div>
        `;
        return;
      }

      await ensureAnonymousSession();
      updateAuthorUI();
      await loadFeed();
    }

    init();
  </script>
</body>
</html>
