<script>
    // === COLORES NEÓN ===
    const colores = ['#ff00aa', '#00f3ff', '#aa00ff', '#00ffaa', '#ffaa00', '#00aaff',  '#ff00aa', '#00f3ff', '#A5F2A2', '#FFF70B',  '#ffaa00', '#00aaff', '#F473C6', '#FFEA23', '#00ffaa', '#D468D7', '#A0FFCC', '#DE434B', '#363034', '#A5F2A2', '#3585E4', '#A52031'];
    let indice = 0;

    const nombre = document.getElementById('nombre');
    const apellido = document.getElementById('apellido');
    const foto = document.getElementById('foto');

    function cambiarColor() {
      const color = colores[indice];
      
      nombre.style.color = color;
      apellido.style.color = color;
      foto.style.borderColor = color;
      foto.style.boxShadow = `0 0 50px ${color}`;

      // Actualizar color de partículas
      if (window.particles) window.particles.color = color;

      indice = (indice + 1) % colores.length;
    }

    // Iniciar colores
    nombre.style.color = colores[0];
    apellido.style.color = colores[0];
    foto.style.borderColor = colores[0];
    foto.style.boxShadow = `0 0 20px ${colores[0]}`;

    setInterval(cambiarColor, 5000);

    // === SISTEMA DE PARTÍCULAS NEÓN ===
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let particlesArray = [];
    let particleColor = colores[0];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1 + 2;
        this.speedX = Math.random() * 2 - 1;
        this.speedY = Math.random() * 0.6 - 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = particleColor;
        ctx.shadowBlur = 15;
        ctx.shadowColor = particleColor;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 62);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < 265; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    window.particles = { color: colores[0] };
    Object.defineProperty(window.particles, 'color', {
      set: function(val) {
        particleColor = val;
      }
    });

    initParticles();
    animateParticles();
  </script>

            if (!isOwner) return alert("Solo el owner puede publicar.");
            const content = document.getElementById('post-text').value.trim();
            if (!content) return;

            await supabase.from('posts').insert({
                user_id: currentUser.id,

            document.getElementById('post-text').value = '';
            loadPosts();

                        <div class="flex gap-x-4 text-sm">
                            <button onclick="likeMessage(${msg.id}, this)">
                                <i class="fa-solid fa-heart"></i> <span>${msg.likes || 0}</span>
                            </button>
                            <button onclick="sharePost()">Compartir</button>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        async function likeMessage(id, element) {
            const { data } = await supabase.from('messages').select('likes').eq('id', id).single();
            await supabase.from('messages').update({ likes: (data.likes || 0) + 1 }).eq('id', id);
            loadMessages();
        }

        // ==================== YOUTUBE ====================
        async function loadYoutube() {
            const { data } = await supabase.from('youtube').select('*').order('created_at', { ascending: false });
            if (data) renderYoutube(data);
        }

        async function addYoutubeVideo() {
            if (!isOwner) return alert("Solo el owner puede agregar videos.");
            const url = document.getElementById('yt-url').value.trim();
            const desc = document.getElementById('yt-desc').value.trim();
            if (!url) return;

            let videoId = url.split('v=')[1] || url.split('/').pop();
            if (videoId.includes('&')) videoId = videoId.split('&')[0];

            await supabase.from('youtube').insert({
                user_id: currentUser.id,
                url: `https://www.youtube.com/embed/${videoId}`,
                description: desc || "Video recomendado"
            });

            document.getElementById('yt-url').value = '';
            document.getElementById('yt-desc').value = '';
            loadYoutube();
        }

        function renderYoutube(videos) {
            const container = document.getElementById('youtube-feed');
            container.innerHTML = '';
            videos.forEach(video => {
                const el = document.createElement('div');
                el.className = `facebook-post rounded-3xl overflow-hidden`;
                el.innerHTML = `
                    <div class="aspect-video">
                        <iframe width="100%" height="100%" src="${video.url}" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="p-4">
                        <p class="text-sm">${video.description}</p>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // ==================== UTILIDADES ====================
        function sharePost() {
            alert("Enlace copiado (simulado)");
        }

        function switchTab(tabIndex) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active', 'text-white'));
            document.getElementById(`tab-${tabIndex}`).classList.remove('hidden');
            document.querySelector(`[data-tab="${tabIndex}"]`).classList.add('tab-active', 'text-white');
        }

        function closeModal() {
            document.getElementById('media-modal').classList.add('hidden');
            document.getElementById('media-modal').classList.remove('flex');
        }

        // ==================== INICIALIZACIÓN ====================
        async function init() {
            await checkUser();
            await loadPosts();
            await loadStories();
            await loadMessages();
            await loadYoutube();

            supabase.auth.onAuthStateChange((event, session) => {
                if (session) checkUser();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
